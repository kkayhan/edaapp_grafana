apiVersion: v1
kind: ServiceAccount
metadata:
  name: eda-topoview
  namespace: eda-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eda-topoview
rules:
  # Read the fabric topology across all namespaces (auto-discovery + rendering).
  - apiGroups: ["core.eda.nokia.com"]
    resources: ["toponodes", "topolinks"]
    verbs: ["get", "list", "watch"]
  # Optional role cross-check + interface enrichment.
  - apiGroups: ["fabrics.eda.nokia.com"]
    resources: ["fabrics"]
    verbs: ["get", "list"]
  - apiGroups: ["interfaces.eda.nokia.com"]
    resources: ["interfaces"]
    verbs: ["get", "list"]
  # Discover namespaces (best-effort; also implied by cluster-wide CR lists).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  # Manage this app's own cluster-scoped config + write its status.
  - apiGroups: ["topoview.eda.edacommunity.com"]
    resources: ["topoviewconfigs"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["topoview.eda.edacommunity.com"]
    resources: ["topoviewconfigs/status"]
    verbs: ["get", "update", "patch"]
  # EQL-direct telemetry: read the pre-existing EDA-core secrets needed to obtain
  # an eda-api bearer token (password grant) for /core/query/v1/eql. Read-only,
  # scoped to just these three secrets; the app ships none of them.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["keycloak-admin-secret", "eda-api-ca", "eda-realm-auth-secret"]
  # Auto-detect the cluster's external host (never hardcoded) to point Grafana's
  # root URL at it: read EngineConfig, patch the bundled Grafana Deployment.
  - apiGroups: ["core.eda.nokia.com"]
    resources: ["engineconfigs"]
    verbs: ["get"]
    resourceNames: ["engine-config"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
    resourceNames: ["grafana"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eda-topoview
subjects:
  - kind: ServiceAccount
    name: eda-topoview
    namespace: eda-system
roleRef:
  kind: ClusterRole
  name: eda-topoview
  apiGroup: rbac.authorization.k8s.io
