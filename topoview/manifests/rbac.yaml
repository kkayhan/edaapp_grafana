apiVersion: v1
kind: ServiceAccount
metadata:
  name: eda-topoview
  namespace: eda-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eda-topoview
rules:
  # Read the fabric topology across all namespaces (auto-discovery + rendering).
  - apiGroups: ["core.eda.nokia.com"]
    resources: ["toponodes", "topolinks"]
    verbs: ["get", "list", "watch"]
  # Optional role cross-check + interface enrichment.
  - apiGroups: ["fabrics.eda.nokia.com"]
    resources: ["fabrics"]
    verbs: ["get", "list"]
  - apiGroups: ["interfaces.eda.nokia.com"]
    resources: ["interfaces"]
    verbs: ["get", "list"]
  # Discover namespaces (best-effort; also implied by cluster-wide CR lists).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  # Manage this app's own cluster-scoped config + write its status.
  - apiGroups: ["topoview.eda.edacommunity.com"]
    resources: ["topoviewconfigs"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["topoview.eda.edacommunity.com"]
    resources: ["topoviewconfigs/status"]
    verbs: ["get", "update", "patch"]
  # Ensure the two Prometheus Export CRs (interface oper-state + traffic-rate)
  # the flow panel needs. An EDA app can't ship prom.eda.nokia.com CRs in its
  # bundle (foreign group), so the controller creates them at runtime instead.
  - apiGroups: ["prom.eda.nokia.com"]
    resources: ["exports"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eda-topoview
subjects:
  - kind: ServiceAccount
    name: eda-topoview
    namespace: eda-system
roleRef:
  kind: ClusterRole
  name: eda-topoview
  apiGroup: rbac.authorization.k8s.io
