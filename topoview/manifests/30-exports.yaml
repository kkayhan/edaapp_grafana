# The only two EDA Prometheus exports the topology flow panel needs. Namespace-
# agnostic: one set in eda-system produces node_srl_interface_* for EVERY EDA
# namespace (gated in queries by the namespace_name label). Requires the
# prom.eda.nokia.com exporter app to be installed.
apiVersion: prom.eda.nokia.com/v1alpha1
kind: Export
metadata:
  name: td-interface
  namespace: eda-system
spec:
  exports:
    - path: .namespace.node.srl.interface
      mappings:
        - source: enable
          destination: "1"
        - source: disable
          destination: "0"
        - source: up
          destination: "1"
        - source: down
          destination: "0"
      metricName:
        regex: namespace_(.+)
        replacement: $1
---
apiVersion: prom.eda.nokia.com/v1alpha1
kind: Export
metadata:
  name: td-interface-traffic-rate
  namespace: eda-system
spec:
  exports:
    - path: .namespace.node.srl.interface.traffic-rate
      metricName:
        regex: namespace_(.+)
        replacement: $1
