apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: eda-system
  labels:
    app: grafana
    eda.nokia.com/app-group: topoview
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        eda.nokia.com/app-group: topoview
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:12.0.2
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_INSTALL_PLUGINS
              value: "andrewbmchugh-flow-panel,yesoreyeram-infinity-datasource"
            # read-only for humans, no login screen: land straight on the menu
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            # basic auth stays on so the controller can WRITE dashboards
            - name: GF_AUTH_BASIC_ENABLED
              value: "true"
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: topoview-grafana-admin
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: topoview-grafana-admin
                  key: admin-password
            - name: GF_USERS_DEFAULT_THEME
              value: "light"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: "/var/lib/grafana/dashboards/menu.json"
            # Served behind the EDA HttpProxy under this path. The value is OWNED by
            # the controller in the topoview-grafana-rooturl ConfigMap (it detects
            # the cluster's external host from EngineConfig). Referencing the CM here
            # keeps this Deployment spec stable, so the app-loader reasserting the
            # bundle never rolls Grafana. optional: Grafana still boots before the
            # controller has created the CM (the controller then restarts it once).
            - name: GF_SERVER_ROOT_URL
              valueFrom:
                configMapKeyRef:
                  name: topoview-grafana-rooturl
                  key: root_url
                  optional: true
            - name: GF_LOG_LEVEL
              value: "warn"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: config
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
            - name: config
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
            - name: config
              mountPath: /var/lib/grafana/dashboards/menu.json
              subPath: menu.json
            - name: storage
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: topoview-grafana-config
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: eda-system
  labels:
    app: grafana
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: grafana
