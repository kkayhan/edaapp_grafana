apiVersion: v1
kind: Secret
metadata:
  name: topoview-grafana-admin
  namespace: eda-topoview
type: Opaque
stringData:
  # Grafana admin credentials. Humans reach Grafana anonymously as read-only
  # Viewers; the controller uses these only to WRITE dashboards via the Grafana API.
  # PLACEHOLDER — set a strong password before deploying.
  admin-user: admin
  admin-password: "CHANGE-ME-set-a-strong-password"
