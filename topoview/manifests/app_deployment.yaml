apiVersion: apps/v1
kind: Deployment
metadata:
  name: eda-topoview
  namespace: eda-topoview
  labels:
    eda.nokia.com/app: eda-topoview
    eda.nokia.com/app-group: control-plane
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      eda.nokia.com/app: eda-topoview
  template:
    metadata:
      labels:
        eda.nokia.com/app: eda-topoview
        eda.nokia.com/app-group: control-plane
    spec:
      serviceAccountName: eda-topoview
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: topoview-controller
          image: ghcr.io/kkayhan/edaapp_topoview/topoview-controller:v0.2.1
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RECONCILE_INTERVAL
              value: "30"
            - name: GRAFANA_URL
              value: "http://grafana.eda-topoview.svc.cluster.local:3000"
            - name: GRAFANA_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: topoview-grafana-admin
                  key: admin-user
            - name: GRAFANA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: topoview-grafana-admin
                  key: admin-password
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 12
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "192Mi"
