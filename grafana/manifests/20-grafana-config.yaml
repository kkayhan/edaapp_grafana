apiVersion: v1
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: grafana-menu
        type: file
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: EDA-EQL
        type: yesoreyeram-infinity-datasource
        uid: eda-eql-infinity
        access: proxy
        isDefault: true
        editable: false
        jsonData:
          allowDangerousHTTPMethods: false
  menu.json: |-
    {
      "uid": "grafana-menu",
      "title": "Grafana \u2014 fabric dashboards",
      "tags": [
        "grafana-menu"
      ],
      "editable": false,
      "schemaVersion": 41,
      "version": 0,
      "refresh": "",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 3
          },
          "options": {
            "mode": "markdown",
            "content": "# EDA Fabric Topology\nSelect a namespace below to open its live topology dashboard. Link colours and throughput update automatically."
          },
          "transparent": true
        },
        {
          "id": 2,
          "type": "dashlist",
          "title": "Fabric namespaces",
          "gridPos": {
            "x": 0,
            "y": 3,
            "w": 24,
            "h": 20
          },
          "options": {
            "showHeadings": false,
            "showSearch": true,
            "showRecentlyViewed": false,
            "showStarred": false,
            "showFolderNames": false,
            "tags": [
              "grafana"
            ],
            "maxItems": 100,
            "query": ""
          }
        }
      ]
    }
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: eda-system
