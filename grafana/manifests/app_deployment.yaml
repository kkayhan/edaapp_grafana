apiVersion: apps/v1
kind: Deployment
metadata:
  name: eda-grafana
  namespace: eda-system
  labels:
    eda.nokia.com/app: eda-grafana
    eda.nokia.com/app-group: control-plane
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      eda.nokia.com/app: eda-grafana
  template:
    metadata:
      labels:
        eda.nokia.com/app: eda-grafana
        eda.nokia.com/app-group: control-plane
    spec:
      serviceAccountName: eda-grafana
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: grafana-controller
          image: ghcr.io/kkayhan/eda-catalog/grafana-controller:v26.8.2-1
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RECONCILE_INTERVAL
              value: "30"
            - name: GRAFANA_URL
              value: "http://grafana.eda-system.svc.cluster.local:3000"
            - name: GRAFANA_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-user
            - name: GRAFANA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 12
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "192Mi"
---
# Exposes the controller's /eql/<ns>.json endpoint so the bundled Grafana's
# Infinity datasource can pull live per-interface telemetry (in-cluster only).
apiVersion: v1
kind: Service
metadata:
  name: eda-grafana
  namespace: eda-system
  labels:
    eda.nokia.com/app: eda-grafana
spec:
  ports:
    - name: http
      port: 8080
      targetPort: health
  selector:
    eda.nokia.com/app: eda-grafana
