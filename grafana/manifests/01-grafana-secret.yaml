apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: eda-system
type: Opaque
stringData:
  # Grafana admin credentials. Humans reach Grafana anonymously as read-only
  # Viewers; the controller uses these to WRITE dashboards via the Grafana API.
  admin-user: admin
  admin-password: "CHANGE-ME-set-a-strong-password"
